<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <radialGradient id="bikeGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bikeGlow)" rx="8"/>
  <!-- Top brand bar -->
  <text x="32" y="42" fill="#fff" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="2">VELOCE</text>
  <rect x="32" y="50" width="18" height="2" fill="#e50914"/>
  
  <!-- Bicycle vector illustration -->
  <g transform="translate(180, 80)" stroke="#999" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Wheels -->
    <circle cx="50" cy="180" r="55" stroke="#555" stroke-width="6"/>
    <circle cx="50" cy="180" r="50" stroke="#222" stroke-width="2"/>
    <circle cx="250" cy="180" r="55" stroke="#555" stroke-width="6"/>
    <circle cx="250" cy="180" r="50" stroke="#222" stroke-width="2"/>
    <!-- Spokes -->
    <path d="M50 125 L50 235 M-5 180 L105 180 M11 141 L89 219 M11 219 L89 141" stroke="#333" stroke-width="1.5"/>
    <path d="M250 125 L250 235 M195 180 L305 180 M211 141 L289 219 M211 219 L289 141" stroke="#333" stroke-width="1.5"/>
    <!-- Frame -->
    <path d="M50 180 L130 180 L200 100 L115 100 Z" stroke="url(#redGrad)" stroke-width="6"/>
    <path d="M130 180 L170 80" stroke="url(#redGrad)" stroke-width="6"/>
    <path d="M200 100 L250 180" stroke="#777" stroke-width="5"/>
    <!-- Saddle & Handlebar -->
    <path d="M155 76 L185 76" stroke="#fff" stroke-width="5"/>
    <path d="M190 85 L200 100 L195 70 L215 70" stroke="#fff" stroke-width="4"/>
    <!-- Pedals / Crank -->
    <circle cx="130" cy="180" r="12" stroke="#bbb" stroke-width="3"/>
    <path d="M130 180 L145 195 M125 195 L150 195" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Typography overlay -->
  <text x="32" y="190" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" letter-spacing="1">VELOCE</text>
  <text x="32" y="215" fill="#e50914" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" letter-spacing="3">BICYCLE</text>
  <text x="32" y="255" fill="#666" font-family="sans-serif" font-size="10" letter-spacing="1.5">RIDE BEYOND</text>
  <text x="32" y="270" fill="#666" font-family="sans-serif" font-size="10" letter-spacing="1.5">LIMITS</text>
</svg>