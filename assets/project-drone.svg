<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <radialGradient id="droneGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f1013"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <linearGradient id="propellerSpin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#droneGlow)" rx="8"/>

  <!-- Quadcopter Drone Vector Illustration -->
  <g transform="translate(160, 50)">
    <!-- Gesture Control Hand Wave Icon -->
    <g transform="translate(200, 30)" opacity="0.85">
      <circle cx="20" cy="20" r="28" fill="none" stroke="#e50914" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle cx="20" cy="20" r="38" fill="none" stroke="#e50914" stroke-width="1" stroke-dasharray="2 4"/>
      <!-- Hand silhouette -->
      <path d="M12 28 L12 18 C12 16 14 14 16 14 C17 14 18 15 19 16 L19 12 C19 10 21 9 22 9 C23 9 24 10 24 12 L24 10 C24 8 26 7 27 7 C28 7 29 8 30 10 L30 20 L27 28 Z" fill="#e50914"/>
    </g>

    <!-- Drone Arms (X-Frame) -->
    <line x1="30" y1="50" x2="190" y2="170" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    <line x1="190" y1="50" x2="30" y2="170" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    <line x1="30" y1="50" x2="190" y2="170" stroke="#e50914" stroke-width="2"/>
    <line x1="190" y1="50" x2="30" y2="170" stroke="#e50914" stroke-width="2"/>

    <!-- Central Flight Controller Fuselage -->
    <rect x="85" y="85" width="50" height="50" rx="8" fill="#141418" stroke="#555" stroke-width="2"/>
    <circle cx="110" cy="110" r="14" fill="#0d0d10" stroke="#e50914" stroke-width="2"/>
    <circle cx="110" cy="110" r="5" fill="#e50914"/>

    <!-- 4 Rotors & Glowing Propeller Blur Circles -->
    <!-- Front Left -->
    <circle cx="30" cy="50" r="34" fill="none" stroke="url(#propellerSpin)" stroke-width="3" stroke-dasharray="12 6"/>
    <circle cx="30" cy="50" r="8" fill="#1e1e24" stroke="#e50914" stroke-width="2"/>

    <!-- Front Right -->
    <circle cx="190" cy="50" r="34" fill="none" stroke="url(#propellerSpin)" stroke-width="3" stroke-dasharray="12 6"/>
    <circle cx="190" cy="50" r="8" fill="#1e1e24" stroke="#e50914" stroke-width="2"/>

    <!-- Rear Left -->
    <circle cx="30" cy="170" r="34" fill="none" stroke="url(#propellerSpin)" stroke-width="3" stroke-dasharray="12 6"/>
    <circle cx="30" cy="170" r="8" fill="#1e1e24" stroke="#e50914" stroke-width="2"/>

    <!-- Rear Right -->
    <circle cx="190" cy="170" r="34" fill="none" stroke="url(#propellerSpin)" stroke-width="3" stroke-dasharray="12 6"/>
    <circle cx="190" cy="170" r="8" fill="#1e1e24" stroke="#e50914" stroke-width="2"/>
  </g>

  <!-- Title & Specs Overlay -->
  <text x="36" y="46" fill="#e50914" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="2">AEROSPACE / EMBEDDED</text>
  <text x="36" y="270" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">GESTURE CONTROLLED</text>
  <text x="36" y="296" fill="#e50914" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">SMART DRONE</text>
  <text x="36" y="325" fill="#888" font-family="sans-serif" font-size="11" letter-spacing="1">MPU6050 ACCELEROMETER/GYRO • NRF24L01 RF • FLIGHT STABILIZER</text>
</svg>