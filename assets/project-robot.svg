<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <radialGradient id="robotGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c1214"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#robotGlow)" rx="8"/>
  
  <!-- Robot Schematic / Illustration -->
  <g transform="translate(160, 60)">
    <!-- Ultrasonic Radar Cones -->
    <path d="M140 70 L280 20 L280 120 Z" fill="url(#laserBeam)"/>
    <path d="M140 100 L260 70 L260 130 Z" fill="url(#laserBeam)"/>

    <!-- Robot Chassis (Top View / 3/4) -->
    <rect x="20" y="50" width="120" height="150" rx="16" fill="#18181c" stroke="#333" stroke-width="2"/>
    <rect x="30" y="60" width="100" height="130" rx="10" fill="#0d0d10" stroke="#e50914" stroke-width="1.5"/>

    <!-- Arduino Microcontroller PCB -->
    <rect x="42" y="75" width="76" height="55" rx="4" fill="#0b3846" stroke="#177e89" stroke-width="1.5"/>
    <rect x="50" y="85" width="22" height="15" fill="#222"/>
    <circle cx="95" cy="90" r="3" fill="#e50914"/>
    <circle cx="105" cy="90" r="3" fill="#00ff66"/>

    <!-- Ultrasonic Sensor (HC-SR04 "Eyes") -->
    <rect x="130" y="70" width="22" height="40" rx="6" fill="#0b3846" stroke="#177e89" stroke-width="1.5"/>
    <circle cx="141" cy="79" r="7" fill="#c0c0c0" stroke="#e50914" stroke-width="1.5"/>
    <circle cx="141" cy="79" r="3" fill="#111"/>
    <circle cx="141" cy="101" r="7" fill="#c0c0c0" stroke="#e50914" stroke-width="1.5"/>
    <circle cx="141" cy="101" r="3" fill="#111"/>

    <!-- Left & Right Wheels -->
    <rect x="5" y="60" width="14" height="45" rx="4" fill="#2a2a2e" stroke="#555"/>
    <rect x="5" y="145" width="14" height="45" rx="4" fill="#2a2a2e" stroke="#555"/>
    <rect x="141" y="145" width="14" height="45" rx="4" fill="#2a2a2e" stroke="#555"/>
    <!-- Caster wheel -->
    <circle cx="80" cy="195" r="8" fill="#555"/>
  </g>

  <!-- Title & Specs Overlay -->
  <text x="36" y="46" fill="#e50914" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="2">ROBOTICS / ARDUINO</text>
  <text x="36" y="270" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">OBSTACLE AVOIDING</text>
  <text x="36" y="296" fill="#e50914" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">AUTONOMOUS ROBOT</text>
  <text x="36" y="325" fill="#888" font-family="sans-serif" font-size="11" letter-spacing="1">HC-SR04 • L298N DUAL MOTOR DRIVER • ARDUINO UNO</text>
</svg>